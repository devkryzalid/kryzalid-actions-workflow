name: Security update WordPress

on:
  workflow_call:
    inputs:
      production_branch:
        description: "Branche déployée en production (main ou master)"
        required: true
        type: string
      staging_branch:
        description: "Branche déployée en staging, dans laquelle la branche de correctif est aussi mergée. Vide = pas de staging"
        required: false
        type: string
        default: ""
      dev_branch:
        description: "Branche de travail remise à jour après le merge du correctif en production"
        required: false
        type: string
        default: "dev"
      php_version:
        description: "Version PHP du serveur de production : une version de plugin qui exige plus doit échouer ici, pas au déploiement"
        required: false
        type: string
        default: "8.3"
      tools_ref:
        description: "Ref de kryzalid-actions-workflow d'ou lire les scripts PHP : a aligner sur la ref du uses: quand on teste une branche"
        required: false
        type: string
        default: "main"
    secrets:
      SECURITY_BOT_CLIENT_ID:
        required: true
      SECURITY_BOT_PRIVATE_KEY:
        required: true
      COMPOSER_AUTH:
        required: false

permissions:
  contents: read

# No concurrency group: GitHub keeps a single pending run per group and cancels the others,
# which would drop a second vulnerability dispatched right after the first.

jobs:
  update:
    # Default branch only: a dispatch on another branch would run an unreviewed caller.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # In a reusable workflow, `inputs` holds workflow_call inputs: the dispatch inputs live in github.event.inputs.
      RUN_SITE_ID: ${{ github.event.inputs.run_site_id }}
      TYPE: ${{ github.event.inputs.type }}
      SLUG: ${{ github.event.inputs.slug }}
      TITLE: ${{ github.event.inputs.title }}
      PATCHED_IN: ${{ github.event.inputs.patched_in }}
      CVE: ${{ github.event.inputs.cve }}
      SEVERITY: ${{ github.event.inputs.severity }}
      ADVISORY_URL: ${{ github.event.inputs.advisory_url }}
      PRODUCTION_BRANCH: ${{ inputs.production_branch }}
      STAGING_BRANCH: ${{ inputs.staging_branch }}
    steps:
      # Dispatch inputs only ever reach scripts through env: never interpolate them in run blocks.
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::Input invalide : $1"; exit 1; }
          [[ "$RUN_SITE_ID" =~ ^[0-9]+$ ]] || fail run_site_id
          [[ "$TYPE" =~ ^(plugin|theme|core)$ ]] || fail type
          [[ "$SLUG" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || fail slug
          [[ "$PATCHED_IN" =~ ^[0-9][0-9A-Za-z.+-]{0,30}$ ]] || fail patched_in
          [[ "$CVE" =~ ^(CVE-[0-9]{4}-[0-9]{1,7})?$ ]] || fail cve
          [[ "$SEVERITY" =~ ^(low|medium|high|critical)?$ ]] || fail severity
          # Held in a variable: an inline & breaks the pattern, and POSIX caps bounds at 255.
          advisory_pattern='^(https://[A-Za-z0-9./?=_%:#&-]{1,250})?$'
          [[ "$ADVISORY_URL" =~ $advisory_pattern ]] || fail advisory_url
          [ -n "$TITLE" ] || fail title

      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SECURITY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout site
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.production_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: site

      - name: Checkout security update tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Public repository: no token, so the write-capable bot needs no access to the shared workflows.
          repository: ${{ github.repository_owner }}/kryzalid-actions-workflow
          ref: ${{ inputs.tools_ref }}
          persist-credentials: false
          path: tools
          sparse-checkout: .github/scripts/security-update

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer
          coverage: none

      - name: Update the vulnerable package
        shell: bash
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          CLI="php $GITHUB_WORKSPACE/tools/.github/scripts/security-update/cli.php"
          OUTCOME="$RUNNER_TEMP/outcome.json"
          finish() { $CLI outcome "$@" > "$OUTCOME"; exit 0; }
          abort() { $CLI outcome failed "$1" > "$OUTCOME"; exit 1; }

          # Captured first: with pipefail, grep -q closing the pipe early would make the match look like a failure.
          BRANCHES=$(git ls-remote --heads origin | awk '{print $2}')
          # Whole version only: a plain prefix would let security/elementor-pro-* block elementor.
          SLUG_PATTERN=${SLUG//./\\.}
          if grep -qE "^refs/heads/security/${SLUG_PATTERN}-[0-9]+(\.[0-9]+)*$" <<<"$BRANCHES"; then
            finish skipped "Une branche security/${SLUG}-* existe déjà : PR en cours ?"
          fi

          RESOLVED=$($CLI resolve composer.lock "$TYPE" "$SLUG")
          [ "$(jq -r .status <<<"$RESOLVED")" = ok ] || finish "$(jq -r .status <<<"$RESOLVED")" "$(jq -r .reason <<<"$RESOLVED")"
          export PACKAGE FROM
          PACKAGE=$(jq -r .package <<<"$RESOLVED")
          FROM=$(jq -r .installed <<<"$RESOLVED")

          composer show "$PACKAGE" --all --format=json --no-interaction > "$RUNNER_TEMP/versions.json" \
            || abort "Impossible de lister les versions de $PACKAGE (identifiants Composer ?)."
          PICK=$($CLI pick "$RUNNER_TEMP/versions.json" "$FROM" "$PATCHED_IN")
          [ "$(jq -r .status <<<"$PICK")" = ok ] || finish "$(jq -r .status <<<"$PICK")" "$(jq -r .reason <<<"$PICK")"
          export TO MAJOR_JUMP
          TO=$(jq -r .target <<<"$PICK")
          MAJOR_JUMP=$(jq -r .major_jump <<<"$PICK")

          BRANCH="security/${SLUG}-${TO}"
          git switch -c "$BRANCH"

          if ! OUT=$(composer require "${PACKAGE}:${TO}" --update-with-dependencies --no-interaction 2>&1); then
            echo "$OUT"
            abort "composer require a échoué : $(tail -n 15 <<<"$OUT")"
          fi
          composer validate --no-check-publish --no-interaction || abort "composer validate a échoué."

          DIR=$(composer show "$PACKAGE" --path | awk '{print $2}')
          if ! LINT=$(find "$DIR" -name '*.php' -print0 | xargs -0 -n 1 -P 8 php -l 2>&1); then
            ERRORS=$(grep -v '^No syntax errors' <<<"$LINT" || true)
            echo "$ERRORS"
            abort "php -l a échoué sur $PACKAGE $TO : $(head -n 5 <<<"$ERRORS")"
          fi

          CHANGED=$(git status --porcelain | awk '{print $2}' | sort | tr '\n' ' ')
          [ "$CHANGED" = "composer.json composer.lock " ] || abort "Le diff touche d'autres fichiers que composer.json/lock : $CHANGED"

          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          $CLI commit-message > "$RUNNER_TEMP/commit-message.txt"
          git commit --quiet -F "$RUNNER_TEMP/commit-message.txt" -- composer.json composer.lock
          git push --quiet origin "$BRANCH"

          $CLI pr-body > "$RUNNER_TEMP/pr-body.md"
          PR_URL=$(gh pr create --base "$PRODUCTION_BRANCH" --head "$BRANCH" --title "$($CLI pr-title)" --body-file "$RUNNER_TEMP/pr-body.md")

          if [ -n "$STAGING_BRANCH" ]; then
            git fetch --quiet origin "$STAGING_BRANCH"
            git switch --quiet -c staging-merge "origin/$STAGING_BRANCH"
            if git merge --no-ff -m "Merge branch '$BRANCH' into $STAGING_BRANCH" "$BRANCH"; then
              git push --quiet origin "HEAD:$STAGING_BRANCH"
              gh pr comment "$PR_URL" --body "Mergée dans \`$STAGING_BRANCH\` : déploiement en staging lancé. Vérifier le staging avant de merger."
            else
              git merge --abort
              gh pr comment "$PR_URL" --body "Conflit en mergeant dans \`$STAGING_BRANCH\` : pas de déploiement en staging, à faire à la main."
            fi
          fi

          finish pr_opened "" "$PR_URL" "$TO" "$MAJOR_JUMP"

      - name: Report outcome
        if: always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/tools/.github/scripts/security-update/cli.php" ]; then
            php "$GITHUB_WORKSPACE/tools/.github/scripts/security-update/cli.php" annotation "$RUNNER_TEMP/outcome.json"
          fi

  merge-back:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'security/')
      && github.event.pull_request.base.ref == inputs.production_branch
    runs-on: ubuntu-latest
    env:
      PRODUCTION_BRANCH: ${{ inputs.production_branch }}
      DEV_BRANCH: ${{ inputs.dev_branch }}
    steps:
      - name: GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SECURITY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.dev_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Merge production into dev
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch --quiet origin "$PRODUCTION_BRANCH"
          if git merge --no-ff -m "Merge branch '$PRODUCTION_BRANCH' into $DEV_BRANCH" "origin/$PRODUCTION_BRANCH"; then
            git push --quiet origin "HEAD:$DEV_BRANCH"
          else
            git merge --abort
            gh pr create --base "$DEV_BRANCH" --head "$PRODUCTION_BRANCH" \
              --title "chore: merge $PRODUCTION_BRANCH into $DEV_BRANCH" \
              --body "Conflit après le correctif de sécurité : \`$DEV_BRANCH\` doit être remise à jour à la main."
          fi
