name: Build and Deploy Craft CMS

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging or production)'
        required: true
        type: string
      php_bin:
        description: 'PHP binary/command to use for composer and craft (override on multi-PHP shared servers, e.g. php83)'
        required: false
        type: string
        default: 'php'
      run_composer_install:
        description: 'Run composer install --no-dev --optimize-autoloader after deploy. Set to false if this project manages PHP dependencies outside the CI flow.'
        required: false
        type: boolean
        default: true
      build_assets:
        description: 'Build front-end assets with npm/Vite (npm ci + build script). Set to false if the compiled assets are versioned.'
        required: false
        type: boolean
        default: true
      build_script_staging:
        description: 'npm script run on staging. Falls back to "build" when package.json does not define it.'
        required: false
        type: string
        default: 'build:staging'
      build_script_production:
        description: 'npm script run on production.'
        required: false
        type: string
        default: 'build'
      run_craft_up:
        description: 'Run craft up after deploy (pending migrations + project config apply). Set to false if this project applies them outside the CI flow.'
        required: false
        type: boolean
        default: true
      clear_caches:
        description: 'Run craft clear-caches/all after deploy. Set to false if this project manages its caches outside the CI flow.'
        required: false
        type: boolean
        default: true
    secrets:
      # Staging secrets
      SSH_PRIVATE_KEY_STAGING:
        required: false
      SSH_USER_STAGING:
        required: false
      SERVER_HOST_STAGING:
        required: false
      PROJECT_PATH_STAGING:
        required: false
      # Production secrets
      SSH_PRIVATE_KEY_PROD:
        required: false
      SSH_USER_PROD:
        required: false
      SERVER_HOST_PROD:
        required: false
      PROJECT_PATH_PROD:
        required: false
      # Common secrets
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-craft-${{ inputs.environment }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            if [ -z "${{ secrets.SSH_PRIVATE_KEY_STAGING }}" ] || \
               [ -z "${{ secrets.SSH_USER_STAGING }}" ] || \
               [ -z "${{ secrets.SERVER_HOST_STAGING }}" ] || \
               [ -z "${{ secrets.PROJECT_PATH_STAGING }}" ]; then
              echo "Missing required staging secrets"
              exit 1
            fi
          else
            if [ -z "${{ secrets.SSH_PRIVATE_KEY_PROD }}" ] || \
               [ -z "${{ secrets.SSH_USER_PROD }}" ] || \
               [ -z "${{ secrets.SERVER_HOST_PROD }}" ] || \
               [ -z "${{ secrets.PROJECT_PATH_PROD }}" ]; then
              echo "Missing required production secrets"
              exit 1
            fi
          fi

  deploy:
    needs: validate-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ inputs.environment == 'staging' && secrets.SSH_PRIVATE_KEY_STAGING || secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Configure SSH known hosts
        shell: bash
        env:
          SERVER_HOST: ${{ inputs.environment == 'staging' && secrets.SERVER_HOST_STAGING || secrets.SERVER_HOST_PROD }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Craft CMS (on target server)
        shell: bash
        env:
          SSH_USER: ${{ inputs.environment == 'staging' && secrets.SSH_USER_STAGING || secrets.SSH_USER_PROD }}
          SERVER_HOST: ${{ inputs.environment == 'staging' && secrets.SERVER_HOST_STAGING || secrets.SERVER_HOST_PROD }}
          PROJECT_PATH: ${{ inputs.environment == 'staging' && secrets.PROJECT_PATH_STAGING || secrets.PROJECT_PATH_PROD }}
          BRANCH: ${{ github.ref_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          PHP_BIN: ${{ inputs.php_bin }}
          RUN_COMPOSER_INSTALL: ${{ inputs.run_composer_install }}
          BUILD_ASSETS: ${{ inputs.build_assets }}
          BUILD_SCRIPT_STAGING: ${{ inputs.build_script_staging }}
          BUILD_SCRIPT_PRODUCTION: ${{ inputs.build_script_production }}
          RUN_CRAFT_UP: ${{ inputs.run_craft_up }}
          CLEAR_CACHES: ${{ inputs.clear_caches }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "$SSH_USER@$SERVER_HOST" \
            bash -s -- "$PROJECT_PATH" "$BRANCH" "$ENVIRONMENT" "$PHP_BIN" "$RUN_COMPOSER_INSTALL" "$BUILD_ASSETS" "$BUILD_SCRIPT_STAGING" "$BUILD_SCRIPT_PRODUCTION" "$RUN_CRAFT_UP" "$CLEAR_CACHES" <<'BASH'
          set -euo pipefail
          PROJECT_PATH="$1"
          BRANCH="$2"
          ENVIRONMENT="$3"
          PHP_BIN="$4"
          RUN_COMPOSER_INSTALL="$5"
          BUILD_ASSETS="$6"
          BUILD_SCRIPT_STAGING="$7"
          BUILD_SCRIPT_PRODUCTION="$8"
          RUN_CRAFT_UP="$9"
          CLEAR_CACHES="${10}"

          # Pre-flight checks before the reset: a failure here leaves the live site untouched
          if ! command -v "$PHP_BIN" >/dev/null 2>&1; then
            echo "❌ ERREUR: binaire PHP '$PHP_BIN' introuvable dans PATH. Vérifie l'input php_bin du projet consommateur."
            exit 1
          fi
          if [ "$RUN_COMPOSER_INSTALL" = "true" ]; then
            COMPOSER_BIN="$(command -v composer || true)"
            if [ -z "$COMPOSER_BIN" ]; then
              echo "❌ ERREUR: composer introuvable dans PATH."
              exit 1
            fi
          fi

          git config --global --add safe.directory "$PROJECT_PATH" || true
          cd "$PROJECT_PATH"

          if [ ! -f ".env" ]; then
            echo "❌ ERREUR: .env introuvable dans $PROJECT_PATH. Craft ne peut pas démarrer sans (copier .env.example.$ENVIRONMENT et le remplir)."
            exit 1
          fi

          if [ "$BUILD_ASSETS" = "true" ]; then
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              [ -f ".nvmrc" ] && nvm use || true
            fi
            if ! command -v npm >/dev/null 2>&1; then
              echo "❌ ERREUR: npm introuvable dans PATH. Installe Node/nvm sur le serveur, ou passe build_assets: false si les assets compilés sont versionnés."
              exit 1
            fi
          fi

          echo "📥 Récupération du code..."
          git fetch --all --prune
          git reset --hard "origin/${BRANCH}"
          echo "✅ Reset sur origin/${BRANCH}"

          if [ "$RUN_COMPOSER_INSTALL" = "true" ]; then
            echo "📦 composer install (via $PHP_BIN)..."
            "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction
          else
            echo "⏭️  run_composer_install=false, composer install ignoré pour ce projet."
          fi

          if [ "$BUILD_ASSETS" = "true" ]; then
            echo "🎨 Build des assets front (npm/Vite)..."
            # .nvmrc may have changed with the reset
            if command -v nvm >/dev/null 2>&1 && [ -f ".nvmrc" ]; then
              nvm use || true
            fi
            echo "Node: $(node -v) | npm: $(npm -v)"
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              echo "⚠️  Aucun lockfile → npm install"
              npm install
            fi

            has_script() { node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$1"; }
            if [ "$ENVIRONMENT" = "staging" ]; then
              BUILD_SCRIPT="$BUILD_SCRIPT_STAGING"
            else
              BUILD_SCRIPT="$BUILD_SCRIPT_PRODUCTION"
            fi
            if ! has_script "$BUILD_SCRIPT"; then
              if [ "$ENVIRONMENT" = "staging" ] && has_script build; then
                echo "⚠️  Script npm '$BUILD_SCRIPT' absent de package.json → npm run build"
                BUILD_SCRIPT="build"
              else
                echo "❌ ERREUR: script npm '$BUILD_SCRIPT' absent de package.json."
                exit 1
              fi
            fi
            echo "🏗️  npm run $BUILD_SCRIPT"
            npm run "$BUILD_SCRIPT"
          else
            echo "⏭️  build_assets=false, build front ignoré pour ce projet."
          fi

          if [ "$RUN_CRAFT_UP" = "true" ]; then
            echo "🗄️  craft up (migrations + project config)..."
            "$PHP_BIN" craft up --interactive=0
          else
            echo "⏭️  run_craft_up=false, craft up ignoré pour ce projet."
          fi

          if [ "$CLEAR_CACHES" = "true" ]; then
            echo "🧹 Nettoyage des caches Craft..."
            "$PHP_BIN" craft clear-caches/all --interactive=0
          else
            echo "⏭️  clear_caches=false, clear-caches ignoré pour ce projet."
          fi

          echo "✅ Déploiement terminé."
          BASH

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Prepare notification metadata
        id: meta
        shell: bash
        env:
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
          STACK_NAME: Craft CMS
          STACK_LOGO: https://craftcms.com/craftcms.svg
        run: |
          IS_FAILURE="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          [ "${{ inputs.environment }}" = "production" ] && IS_PROD="true" || IS_PROD="false"

          if [ "$IS_FAILURE" = "true" ]; then
            ICON="❌"
            [ "$IS_PROD" = "true" ] && COLOR="#a01515" || COLOR="#d97706"
          else
            ICON="✅"
            [ "$IS_PROD" = "true" ] && COLOR="#1d7e2a" || COLOR="#3ec55c"
          fi
          [ "$IS_PROD" = "true" ] && ENV_LABEL="🚀 PRODUCTION" || ENV_LABEL="🚧 STAGING"

          step_mark() { [ "$1" = "true" ] && echo "✅" || echo "⏭️ ignoré"; }
          NL='\n'
          STEPS_SUMMARY="• Code : ✅${NL}• Dépendances (composer) : $(step_mark "${{ inputs.run_composer_install }}")${NL}• Build assets (npm) : $(step_mark "${{ inputs.build_assets }}")${NL}• Craft up : $(step_mark "${{ inputs.run_craft_up }}")${NL}• Clear caches : $(step_mark "${{ inputs.clear_caches }}")"

          DEPLOY_DATE=$(date '+%d/%m/%Y %H:%M')
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1 | sed 's/\\/\\\\/g; s/"/\\"/g' | tr -d '\r')
          {
            echo "color=$COLOR"
            echo "icon=$ICON"
            echo "env_label=$ENV_LABEL"
            echo "deploy_date=$DEPLOY_DATE"
            echo "commit_msg=$COMMIT_MSG"
            echo "stack_name=$STACK_NAME"
            echo "stack_logo=$STACK_LOGO"
            echo "sha_short=${GITHUB_SHA:0:7}"
            echo "steps_summary=$STEPS_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "attachments": [{
                "color": "${{ steps.meta.outputs.color }}",
                "fallback": "${{ steps.meta.outputs.icon }} ${{ steps.meta.outputs.env_label }} — ${{ github.repository }} (${{ github.ref_name }}) — ${{ github.actor }}",
                "blocks": [
                  {
                    "type": "context",
                    "elements": [
                      { "type": "image", "image_url": "${{ steps.meta.outputs.stack_logo }}", "alt_text": "${{ steps.meta.outputs.stack_name }}" },
                      { "type": "mrkdwn", "text": "*${{ steps.meta.outputs.stack_name }}*" }
                    ]
                  },
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ steps.meta.outputs.icon }} ${{ steps.meta.outputs.env_label }}",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Repo*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                      { "type": "mrkdwn", "text": "*Branche*\n`${{ github.ref_name }}`" },
                      { "type": "mrkdwn", "text": "*Auteur*\n${{ github.event.head_commit.author.name }}" },
                      { "type": "mrkdwn", "text": "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ steps.meta.outputs.sha_short }}`>" }
                    ]
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "💬 _${{ steps.meta.outputs.commit_msg }}_"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ steps.meta.outputs.steps_summary }}"
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      { "type": "mrkdwn", "text": "📅 ${{ steps.meta.outputs.deploy_date }} • Lancé par ${{ github.actor }} • <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Voir le run>" }
                    ]
                  }
                ]
              }]
            }
